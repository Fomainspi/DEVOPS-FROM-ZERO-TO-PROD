<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="28" fill="#111827"/><text x="600" y="70" text-anchor="middle" fill="#fff" font-size="34" font-family="Arial" font-weight="700">FOMA — Troubleshooting Workflow</text><g font-family="Arial" font-size="23" text-anchor="middle"><rect x="90" y="150" width="190" height="90" rx="16" fill="#1f2937" stroke="#60a5fa" stroke-width="3"/><text x="185" y="205" fill="#fff">Observe</text><rect x="330" y="150" width="190" height="90" rx="16" fill="#1f2937" stroke="#a78bfa" stroke-width="3"/><text x="425" y="205" fill="#fff">Isolate</text><rect x="570" y="150" width="190" height="90" rx="16" fill="#1f2937" stroke="#34d399" stroke-width="3"/><text x="665" y="205" fill="#fff">Hypothesis</text><rect x="810" y="150" width="190" height="90" rx="16" fill="#1f2937" stroke="#fbbf24" stroke-width="3"/><text x="905" y="205" fill="#fff">Test</text><path d="M280 195H330M520 195H570M760 195H810" stroke="#fff" stroke-width="4"/><rect x="350" y="340" width="500" height="110" rx="18" fill="#1f2937" stroke="#f87171" stroke-width="3"/><text x="600" y="390" fill="#fff">One controlled change</text><text x="600" y="425" fill="#cbd5e1" font-size="18">Then verify recovery and document the cause.</text><path d="M905 240V295H600V340" fill="none" stroke="#fff" stroke-width="4"/><text x="600" y="545" fill="#94a3b8" font-size="20">Evidence first. Guessing last.</text></g></svg>