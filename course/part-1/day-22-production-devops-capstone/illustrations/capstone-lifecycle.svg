<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><rect width="1400" height="700" rx="28" fill="#111827"/><text x="700" y="65" text-anchor="middle" fill="#fff" font-size="34" font-family="Arial" font-weight="700">FOMA — Production DevOps Capstone</text><text x="700" y="205" text-anchor="middle" fill="#fff" font-size="28" font-family="Arial">Git → CI → Docker → Registry → Terraform → AWS</text><text x="700" y="330" text-anchor="middle" fill="#fff" font-size="28" font-family="Arial">Kubernetes → Helm → RBAC → Ingress → Observability</text><text x="700" y="480" text-anchor="middle" fill="#fff" font-size="30" font-family="Arial" font-weight="700">Build → Secure → Deploy → Observe → Recover</text><text x="700" y="555" text-anchor="middle" fill="#94a3b8" font-size="20" font-family="Arial">The capstone connects the tools into one operational system.</text></svg>