apiVersion: apps/v1
kind: Deployment
metadata:
  name: foma-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: foma-api
  template:
    metadata:
      labels:
        app: foma-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
{{ toYaml .Values.resources | indent 12 }}
